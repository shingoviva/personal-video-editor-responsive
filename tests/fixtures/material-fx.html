<!doctype html><meta charset="utf-8"><title>Material FX verification</title><button id="run">Run material FX verification</button><pre id="result">Ready</pre>

function analyze(data){return new Promise((resolve,reject)=>{const worker=new Worker('../../dist/material-fx-worker.js?v=2.2.64',{type:'module'}),timer=setTimeout(()=>{worker.terminate();reject(Error('analysis timeout'))},30000);worker.onmessage=({data})=>{if(data.type==='done'||data.type==='error'){clearTimeout(timer);worker.terminate();data.type==='done'?resolve(data):reject(Error(data.error))}};worker.onerror=e=>reject(Error(e.message));worker.postMessage(data)})}
document.querySelector('#run').onclick=async()=>{try{
 const video=new File([await fetch('material-motion.mp4').then(r=>r.blob())],'motion.mp4',{type:'video/mp4'}),audio=new File([await fetch('material-accents.wav').then(r=>r.blob())],'accents.wav',{type:'audio/wav'}),m={id:'v',name:video.name,width:160,height:90,duration:2,fps:24,audio:false,kind:'video'},c={...clip(m),start:0,layer:0},row={clip:c,start:0,end:2,duration:2};
 result.textContent='Analyzing selected texture';const tracked=await analyze({url:new URL('material-motion.mp4',location.href).href,sourceName:'motion.mp4',row,start:0,duration:2,mode:'video',region:{zoomX:.5,zoomY:.5,zoomSize:.35},aspect:'16:9'});if(tracked.trackPath.length<2||tracked.trackPath.length>80||Math.abs(tracked.trackPath.at(-1).x-.1875)>.05||Math.abs(tracked.trackPath.at(-1).y-.5)>.04)throw Error('Target did not follow movement '+JSON.stringify(tracked));
 result.textContent='Analyzing stereo audio';const audioRow={...row,clip:{...c,kind:'audio'}};const onsets=await analyze({file:audio,row:audioRow,start:0,duration:2,mode:'audio'});if(onsets.accents.length!==3)throw Error('Stereo onset count '+onsets.accents.length);
 if(tracked.motionEvents.length!==1)throw Error('Steady pan must not produce repetitive bumps '+tracked.motionEvents.length);const slowRow={...audioRow,clip:{...audioRow.clip,speed:.5,endSpeed:.5},end:4,duration:4};const slow=await analyze({file:audio,row:slowRow,start:0,duration:4,mode:'audio'});if(slow.accents.length!==3||Math.abs(slow.accents[0].time-.8)>.04)throw Error('Audio speed mapping '+JSON.stringify(slow.accents));const reports=[];for(const kind of ['audio-pulse','camera-bump','tracking','focus']){result.textContent='Rendering '+kind;const p=project();p.media=[m];p.clips=[c];p.aspect='Original';p.export={...p.export,resolution:'Source',fps:24,quality:'High',videoBitrate:8};p.effects=[{id:'fx',type:'region-zoom',motionKind:kind==='tracking'?undefined:kind,start:0,duration:2,zoomSize:.35,zoomX:.5,zoomY:.5,zoomIn:0,zoomReturn:false,strength:.5,zoomTexts:false,trackPath:['tracking','focus'].includes(kind)?tracked.trackPath:[],motionPath:kind==='audio-pulse'?accentPath(onsets.accents,2):kind==='camera-bump'?accentPath(tracked.motionEvents,2,{bump:true,direction:tracked.direction,motion:tracked.motion}):[]}];const output=await renderOnDevice(sanitize(JSON.parse(JSON.stringify(p))),[{id:'v',file:video}]);try{const input=new Input({formats:ALL_FORMATS,source:new BlobSource(output.file)});try{const track=await input.getPrimaryVideoTrack(),sample=await new VideoSampleSink(track).getSample(kind==='audio-pulse'?.47:kind==='camera-bump'?tracked.motionEvents[0].time+.07:1);if(!sample)throw Error('decode failure');const at=sample.timestamp,actual=document.createElement('canvas');actual.width=160;actual.height=90;sample.draw(actual.getContext('2d'),0,0,160,90);sample.close();const previewVideo=document.createElement('video');previewVideo.muted=true;previewVideo.src=URL.createObjectURL(video);await new Promise(resolve=>{previewVideo.onloadeddata=resolve;previewVideo.load()});const displayReady=new Promise(resolve=>{if(previewVideo.requestVideoFrameCallback)previewVideo.requestVideoFrameCallback(()=>resolve());else requestAnimationFrame(()=>resolve())});await new Promise(resolve=>{previewVideo.onseeked=resolve;previewVideo.currentTime=at+.001});await displayReady;const processed=document.createElement('canvas'),paint=renderer(processed,{width:160,height:90,preserve:true});paint.draw(previewVideo,c,'160:90');const expected=document.createElement('canvas'),scratch=document.createElement('canvas');expected.width=160;expected.height=90;const ctx=expected.getContext('2d');ctx.drawImage(processed,0,0);const baseline=ctx.getImageData(0,0,160,90).data;drawRegionZoom(ctx,expected,scratch,p.effects,at,160,90);const a=actual.getContext('2d').getImageData(0,0,160,90).data,b=ctx.getImageData(0,0,160,90).data;let error=0,change=0;for(let i=0;i<a.length;i++)if(i%4!==3){error+=Math.abs(a[i]-b[i]);change+=Math.abs(b[i]-baseline[i])}if(change/(160*90*3)<.2)throw Error(kind+' produced no visible effect');const meanError=error/(160*90*3);if(meanError>8){let baseError=0;for(let i=0;i<a.length;i++)if(i%4!==3)baseError+=Math.abs(a[i]-baseline[i]);throw Error(kind+' preview/export mismatch '+JSON.stringify({meanError,baselineError:baseError/(160*90*3),at,change:change/(160*90*3),width:output.width,height:output.height,effect:p.effects[0]}))};paint.dispose();URL.revokeObjectURL(previewVideo.src);reports.push({kind,verified:output.verified,duration:output.duration,meanError})}finally{input.dispose()}}finally{await deleteRender(output.path)}}
 result.dataset.status='pass';result.textContent='PASS\n'+JSON.stringify({tracked:tracked.trackPath,uncertain:tracked.lost,motionEvents:tracked.motionEvents,accents:onsets.accents,reports},null,2);
}catch(error){result.dataset.status='fail';result.textContent='FAIL '+error.stack}};
