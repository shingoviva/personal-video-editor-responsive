<!doctype html><meta charset="utf-8"><title>FX editor setup</title><button id="prepare">Prepare FX test project</button><pre id="result">Ready</pre><a href="../../dist/">Open editor</a>
<script type="module">
import {project,clip} from '../../dist/model.js?v=2.2.64';import {retainFile} from '../../dist/media-vault.js';import {saveBrowserProject} from '../../dist/project-storage.js';
document.querySelector('#prepare').onclick=async()=>{try{const p=project();p.name='PVE FX QA';const v={id:'fx-qa-motion',name:'motion.mp4',kind:'video',width:160,height:90,duration:2,fps:24,audio:false,retained:true},a={id:'fx-qa-accents',name:'accents.wav',kind:'audio',duration:2,audio:true,retained:true};p.media=[v,a];p.clips=[{...clip(v),start:0,layer:0}];p.audioClips=[{...clip(a),kind:'audio',id:'qa-audio',start:0,layer:2}];p.export={...p.export,resolution:'Source',fps:24};for(const [m,url,type]of[[v,'material-motion.mp4','video/mp4'],[a,'material-accents.wav','audio/wav']])await retainFile(m.id,new File([await fetch(url).then(r=>r.blob())],m.name,{type}));await saveBrowserProject(p);document.querySelector('#result').textContent='Ready: PVE FX QA';}catch(e){document.querySelector('#result').textContent=e.stack}};
</script>
