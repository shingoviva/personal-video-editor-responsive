<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../dist/style.css?v=2.2.61"><link rel="stylesheet" href="../../dist/iphone.css?v=2.2.61"><style>body{display:block;padding:24px}#timelineContent{width:320px;position:relative}#result{white-space:pre-wrap}section{margin:30px 0}</style><h3>クリップ本体の移動検証</h3><section id="timelineContent"><div id="videoTrackTop" class="video-track"></div><div id="videoTrackUpper" class="video-track"></div><div id="videoTrack" class="video-track"><div data-clip="v" class="clip-block selected" style="left:10%;width:50%">VIDEO</div></div><div id="audioTrack0" class="audio-track editable-audio"><div data-clip="a" class="clip-block audio-clip selected" style="left:10%;width:50%">AUDIO</div></div><div id="audioTrack1" class="audio-track editable-audio"></div></section><pre id="result">ドラッグ待機</pre><script type="module">
